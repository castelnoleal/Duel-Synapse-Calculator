plugins { id 'com.android.application' }

android {
    namespace 'com.meiocg.duelsynapsecalculator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.meiocg.duelsynapsecalculator'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug { applicationIdSuffix '.debug' }
        release { minifyEnabled false }
    }
}
